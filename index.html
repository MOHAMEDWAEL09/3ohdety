<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عهدتي</title>
<meta name="description" content="عهدتي: كشف العهدة وكروت حضور العمال">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f3f1fb">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--font:Cairo,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;--bg:#f3f1fb;--card:#fff;--fg:#1d1b3a;--mute:#6b6890;--line:rgba(40,30,110,.12);--ac:#5a4af4;--acs:rgba(90,74,244,.12);--on:#fff;--ok:#14916c;--oks:rgba(20,145,108,.13);--bad:#d6444a;--bads:rgba(214,68,74,.12);color-scheme:light}
:root[data-theme=sand]{--bg:#f6efe4;--card:#fffaf2;--fg:#2b2118;--mute:#7d6c58;--line:rgba(80,50,20,.14);--ac:#b4572b;--acs:rgba(180,87,43,.12)}
:root[data-theme=green]{--bg:#eef5f0;--card:#fafdfb;--fg:#12261c;--mute:#5d7a6b;--line:rgba(20,60,40,.13);--ac:#10806a;--acs:rgba(16,128,106,.12)}
:root[data-theme=navy]{color-scheme:dark;--bg:#0c1222;--card:#161e36;--fg:#eef1fa;--mute:#9aa6c6;--line:rgba(255,255,255,.12);--ac:#7fa2ff;--acs:rgba(127,162,255,.16);--on:#0c1222;--ok:#3ecfa6;--oks:rgba(62,207,166,.15);--bad:#ff7b80;--bads:rgba(255,123,128,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.45;direction:rtl}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:start}
input,select{outline:none}
[hidden]{display:none!important}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;max-width:560px;margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0)}
.top{display:flex;align-items:center;gap:6px;padding:12px 16px 8px;flex:none}
.top h1{margin:0;font-size:26px;font-weight:800;flex:1}
.top h2{margin:0;font-size:19px;font-weight:800}
.top small{color:var(--mute);display:block}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ac);flex:none}
.ib:active{background:var(--acs)}
.main{flex:1;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));flex:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:14px;color:var(--mute);font-size:12px;font-weight:600;min-width:0}
.tab.on{color:var(--ac);background:var(--acs)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.item{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.item:active{background:var(--acs)}
.badge{width:48px;height:48px;border-radius:14px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.grow{flex:1;min-width:0}
.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small,.sm{color:var(--mute);font-size:14px}
.num{font-variant-numeric:tabular-nums;font-weight:800}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.btn{height:54px;border-radius:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--line);width:100%;text-align:center}
.btn.pri{background:var(--ac);color:var(--on);border:0}
.btn.ok{background:var(--ok);color:#fff;border:0}
.btn.bd{background:var(--bad);color:#fff;border:0}
.btn.dng{color:var(--bad);background:var(--bads);border:0}
.btn.s{height:44px;font-size:15px}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.big{text-align:center;padding:18px 10px}
.big b{display:block;font-size:40px;line-height:1.2}
.empty{text-align:center;color:var(--mute);padding:40px 20px}
.entry{display:flex;align-items:center;gap:10px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line)}
.entry b.n{font-size:18px}
.dbar{display:flex;align-items:center;background:linear-gradient(135deg,var(--acs),var(--card));border:1px solid var(--line);border-radius:20px;padding:6px}
.dbar .mid{flex:1;text-align:center;position:relative;line-height:1.3}
.dbar .mid b{font-size:19px}
.dbar input{position:absolute;inset:0;opacity:0;width:100%}
.w{display:flex;flex-direction:column;gap:10px}
.w .hd{display:flex;align-items:center;gap:10px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sb{height:50px;border-radius:14px;background:var(--bg);font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mute);border:1px solid var(--line)}
.sb.on.p{background:var(--ok);color:#fff;border:0}.sb.on.a{background:var(--bad);color:#fff;border:0}.sb.on.o{background:var(--mute);color:var(--bg);border:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:12px;background:var(--bg);font-size:22px;font-weight:800;text-align:center;border:1px solid var(--line)}
.step span{min-width:34px;text-align:center;font-weight:800}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{color:var(--ac);font-weight:700;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats .card{text-align:center;padding:10px 4px}.stats b{font-size:24px;display:block}
.pl{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.pl:last-child{border:0;font-weight:800;font-size:19px;color:var(--ac)}
.day{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;border-bottom:1px solid var(--line)}
.day .dn{width:46px;text-align:center;line-height:1.2}.day .dn b{display:block;font-size:18px}
.tg{padding:3px 12px;border-radius:12px;font-size:14px;font-weight:700;background:var(--bg);color:var(--mute)}
.tg.p{background:var(--oks);color:var(--ok)}.tg.a{background:var(--bads);color:var(--bad)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:26px 26px 0 0;max-height:92%;display:flex;flex-direction:column}
.sheet .sh{display:flex;align-items:center;padding:14px 18px 4px}.sheet .sh h3{margin:0;flex:1;font-size:20px}
.sheet .sb2{overflow-y:auto;padding:8px 18px;display:flex;flex-direction:column;gap:14px}
.sheet .sf{padding:10px 18px calc(14px + env(safe-area-inset-bottom,0));display:flex;gap:10px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:14px;color:var(--mute)}
.inp{height:54px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 14px;width:100%}
.inp:focus{border-color:var(--ac)}
.inp.amt{font-size:26px;font-weight:800;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:18px;background:var(--acs);color:var(--ac);font-weight:700;font-size:15px}
.th{display:flex;gap:12px}.th button{width:44px;height:44px;border-radius:50%;border:3px solid var(--line)}.th button.on{border-color:var(--fg)}
.hb{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:14px}.hb .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb .t{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}.hb .t i{display:block;height:100%;background:var(--ac)}
.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:130px}.trend .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}.trend .col i{display:block;width:100%;max-width:34px;background:var(--ac);opacity:.5;border-radius:6px 6px 2px 2px;min-height:2px}.trend .col.cur i{opacity:1}.trend small{font-size:11px}
.thumb{width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--line);flex:none}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pv{overflow:auto;max-height:68vh;border-radius:10px;border:1px solid var(--line)}.pv img{display:block;width:100%}
.panel{display:flex;flex-direction:column;gap:10px}.panel h3{margin:0;font-size:16px}
:root{--star:#d99a1b}:root[data-theme=navy]{--star:#f2c55c}
.ic.on{fill:currentColor}.stars{display:inline-flex;gap:2px;color:var(--star);margin:2px 0}.stars .ic{width:18px;height:18px}.rate{display:flex;gap:6px;justify-content:center}.rate button{color:var(--mute);padding:4px}.rate button.on{color:var(--star)}.rate .ic{width:40px;height:40px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:700;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></symbol>

<script>
(()=>{'use strict';
const KEY='ahdati.v1';
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const p2=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>y+'-'+p2(m+1)+'-'+p2(d);
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const toISO=d=>iso(d.getFullYear(),d.getMonth(),d.getDate());
const today=()=>toISO(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return toISO(d)};
const fmtD=s=>{const a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0]};
const fmtN=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US');
const r2=x=>Math.round((+x||0)*100)/100;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const wd=s=>parse(s).getDay();
const num=v=>{const s=String(v==null?'':v).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/٫/g,'.').replace(/[,٬،\s]/g,'');const n=parseFloat(s);return isFinite(n)?n:0};
const ic=n=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+n+'"/></svg>';

/* ---------- data ---------- */
const DEF={company:'مؤسسة بناء الساحل للمقاولات العامة',sheetTitle:'كشف تسوية عهدة',cardTitle:'كارت العمل الخاص بشهر',engineerLabel:'المهندس المشرف',accountsLabel:'الحسابات',offDay:5,theme:'ink',otMult:1.5,paidOff:0,payOnCard:1};
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.v===1)return o}catch(e){}return null}
let S=load()||{v:1,settings:{},projects:[],custodies:[],workers:[],days:{},advances:[]};
function fix(){S.settings=Object.assign({},DEF,S.settings||{});S.settings.offFri=1;['projects','custodies','workers','advances','pays','reviews'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!S.days)S.days={}}
if(S.settings&&!S.settings.offFri)S.settings.offDay=5;
fix();
let st=0;const flush=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{clearTimeout(st);st=setTimeout(flush,150)};
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
const THEMES=[['ink','#5a4af4'],['sand','#b4572b'],['green','#10806a'],['navy','#16204a']];
const applyTheme=()=>{const t=THEMES.some(x=>x[0]===S.settings.theme)?S.settings.theme:'ink';document.documentElement.setAttribute('data-theme',t)};

const nd=new Date();
const UI={wk:'w',tab:'custody',view:null,date:today(),m:{y:nd.getFullYear(),m:nd.getMonth()},sh:null,f:{},_k:''};
const cust=id=>S.custodies.find(c=>c.id===id);
const wk=id=>S.workers.find(w=>w.id===id);
const isOff=d=>wd(d)===+S.settings.offDay;
const dk=(w,d)=>w+'|'+d;
const getDay=(w,d)=>S.days[dk(w,d)]||null;
function custBal(c){const o=+c.opening||0;let rec=o>0?o:0,exp=o<0?-o:0;c.entries.forEach(x=>{if(x.t==='r')rec+=x.amt;else exp+=x.amt});return{rec,exp,bal:rec-exp}}
function setDay(w,d,p){const k=dk(w,d);const n=Object.assign({},S.days[k]||{},p);if(!n.s&&!(+n.ot)&&!(+n.ded)&&!n.note)delete S.days[k];else S.days[k]=n;save()}
function setStatus(w,d,s){const cur=getDay(w,d)||{};if(cur.s===s){setDay(w,d,{s:'',ot:0});return}setDay(w,d,s==='p'?{s}:s==='a'?{s,ot:0}:{s,ot:0,ded:0})}
function ms(w,y,m){let p=0,po=0,a=0,o=0,ot=0,ded=0;for(let d=1;d<=dim(y,m);d++){const r=S.days[dk(w,iso(y,m,d))];if(!r)continue;if(r.s==='p'){p++;if(isOff(iso(y,m,d)))po++}else if(r.s==='a')a++;else if(r.s==='o')o++;ot+=+r.ot||0;ded+=+r.ded||0}return{p,po,a,o,ot,ded}}
function pay(w,y,m){const s=ms(w.id,y,m),wg=+w.wage||0,mo=w.wt==='m',dly=mo?wg/30:wg;
  const base=mo?Math.max(0,wg-s.a*dly):(s.p-s.po+(+S.settings.paidOff===1?s.o:0))*wg;
  const otp=s.ot*(+w.otRate||dly/8*(+S.settings.otMult||1.5));
  return Object.assign({},s,{wg,base:r2(base),otp:r2(otp),net:r2(base+otp-s.ded)})}
const nextDoc=c=>String(Math.max(0,...c.entries.filter(e=>e.t==='e').map(e=>parseInt(e.doc,10)||0))+1);
function descFreq(t){const m={};S.custodies.forEach(c=>c.entries.forEach(e=>{if(e.t===t&&e.desc)m[e.desc]=(m[e.desc]||0)+1}));
  const arr=Object.keys(m).sort((a,b)=>m[b]-m[a]);(t==='e'?['بنزين','مواد بناء','وجبات عمال','نقل','مياه شرب']:['استلام عهدة','تحويل']).forEach(b=>{if(!arr.includes(b))arr.push(b)});return arr.slice(0,6)}

/* photos */
const PH={};
const DB={p:null,open(){return this.p||(this.p=new Promise((res,rej)=>{try{const r=indexedDB.open('ahdati-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))},
  tx(mode,fn){return this.open().then(db=>new Promise((res,rej)=>{const t=db.transaction('p',mode);const rq=fn(t.objectStore('p'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)}))},
  get(k){return this.tx('readonly',s=>s.get(k)).catch(()=>null)},
  put(k,v){return this.tx('readwrite',s=>s.put(v,k)).catch(()=>null)},
  del(k){return this.tx('readwrite',s=>s.delete(k)).catch(()=>null)},
  clear(){return this.tx('readwrite',s=>s.clear()).catch(()=>null)},
  keys(){return this.tx('readonly',s=>s.getAllKeys()).catch(()=>[])}};
function readImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,1400/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url})}
const loadImg=src=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src});
function photoBlock(f){
  if(f.photo)return '<div class="ctl" style="justify-content:flex-start"><button class="thumb" data-a="vph" aria-label="عرض الصورة"><img alt="صورة الفاتورة" src="'+f.photo+'"></button><button class="btn s" data-a="vph" style="width:auto;padding:0 16px">عرض</button><button class="btn dng s" data-a="rph" style="width:auto;padding:0 16px">حذف الصورة</button></div>';
  if(f.hasPhoto)return '<small>جاري تحميل الصورة…</small>';
  return '<label class="btn s">'+ic('cam')+'صورة الفاتورة<input type="file" accept="image/*" hidden data-c="photo"></label>'}
function docIssues(c){const nums=c.entries.filter(e=>e.t==='e'&&/^\d+$/.test(String(e.doc||'').trim())).map(e=>+e.doc);const seen={},dup=[];nums.forEach(n=>{if(seen[n]&&!dup.includes(n))dup.push(n);seen[n]=1});const miss=[];if(nums.length){const mn=Math.min(...nums),mx=Math.max(...nums);for(let i=mn;i<=mx;i++)if(!seen[i])miss.push(i)}return{dup,miss}}

  if(ex.length)er.push([{v:'الإجمالي',s:2},null,null,null,null,{f:'SUM(F2:F'+(ex.length+1)+')',v:r2(ex.reduce((s,e)=>s+e.amt,0)),s:2}]);

  const g1=[HD(['المشروع','المصروفات'])];groupSum(ex,'proj','بدون مشروع').forEach(a=>g1.push([a[0],r2(a[1])]));sheets.push({name:'حسب المشروع',rows:g1,widths:[30,16]});
  const g2=[HD(['البيان','المصروفات'])];groupSum(ex,'desc','بدون بيان').forEach(a=>g2.push([a[0],r2(a[1])]));sheets.push({name:'حسب البيان',rows:g2,widths:[30,16]});
  const cw=S.workers.filter(w=>w.wt==='c');if(cw.length){const cr=[HD(['الاسم','الشغل','المتفق عليه','المدفوع','الباقي'])];cw.forEach(w=>{const rm=contractRem(w);cr.push([w.name,w.job||'',+w.wage||0,r2((+w.wage||0)-rm),rm])});sheets.push({name:'المقطوعية',rows:cr,widths:[22,26,14,14,14]})}
  return buildXlsx(sheets)}

/* ---------- contract workers + reviews ---------- */
const att=()=>S.workers.filter(w=>w.wt!=='c');
const payList=id=>S.pays.filter(p=>p.w===id);
const contractRem=w=>r2((+w.wage||0)-payList(w.id).reduce((s,p)=>s+p.amt,0));
const nz=s=>String(s||'').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).toLowerCase().trim();
const star=on=>'<svg class="ic'+(on?' on':'')+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>';
const starsHTML=n=>n?'<span class="stars" aria-label="'+n+' من 5">'+[1,2,3,4,5].map(i=>star(i<=n)).join('')+'</span>':'';
function revSum(id){const l=S.reviews.filter(r=>r.wid===id);if(!l.length)return '';const st=l.filter(r=>r.stars);const av=st.length?st.reduce((s,r)=>s+r.stars,0)/st.length:0;return ' ('+l.length+(av?' · '+av.toFixed(1)+' من 5':'')+')'}
function scrContract(w){const ps=payList(w.id).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0),paid=r2(ps.reduce((s,p)=>s+p.amt,0)),agreed=+w.wage||0,rem=r2(agreed-paid);
  return '<header class="top"><button class="ib" data-a="back" aria-label="رجوع">'+ic('back')+'</button><div class="grow"><h2>'+esc(w.name)+'</h2><small>مقطوعية'+(w.job?' · '+esc(w.job):'')+'</small></div><button class="ib" data-a="expC" aria-label="تصدير">'+ic('pdf')+'</button><button class="ib" data-a="editW" aria-label="تعديل">'+ic('edit')+'</button></header><main class="main">'+
  '<div class="card big"><small>'+(rem<0?'مدفوع زيادة عن المتفق':'الباقي له')+'</small><b class="num '+(rem<0?'bad':'ok')+'">'+fmtN(Math.abs(rem))+'</b><small>المتفق عليه '+fmtN(agreed)+' · خد '+fmtN(paid)+'</small></div>'+
  '<button class="btn bd" data-a="addPay">'+ic('minus')+'دفعت له</button>'+
  (ps.length?'<div class="card" style="padding:4px 14px">'+ps.map(p=>'<button class="entry" data-a="editPay" data-id="'+p.id+'"><span class="grow"><b>'+fmtD(p.d)+'</b><small>'+esc(p.note||'دفعة')+'</small></span><b class="n num bad">'+fmtN(p.amt)+'</b></button>').join('')+'</div>':'<div class="empty">لم تسجل أي دفعة بعد.</div>')+
  revBlock(w)+'</main>'}
function revList(){const q=nz(UI.rq||'').split(/\s+/).filter(Boolean);
  const l=S.reviews.filter(r=>{if(!r.note)return false;const h=nz(r.name+' '+(r.note||''));return q.every(x=>h.includes(x))}).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
  if(!l.length)return '<div class="empty">'+(S.reviews.some(r=>r.note)?'لا نتائج.':'لا توجد ملاحظات بعد.<br>افتح صفحة أي عامل وأضف ملاحظة من هناك.')+'</div>';
  return l.map(r=>'<button class="item" data-a="noteOpen" data-id="'+r.id+'" style="align-items:flex-start"><span class="badge">'+esc(r.name.trim()[0]||'؟')+'</span><span class="grow"><b>'+esc(r.name)+(wk(r.wid)?'':' (محذوف)')+'</b>'+'<div>'+esc(r.note)+'</div><small>'+fmtD(r.d)+'</small></span></button>').join('')}
function scrNotes(){return '<header class="top"><h1>الملاحظات</h1></header><main class="main"><input class="inp" id="rq" data-q="1" placeholder="ابحث بالاسم أو الملاحظة" value="'+esc(UI.rq||'')+'"><div id="rlist" style="display:flex;flex-direction:column;gap:10px">'+revList()+'</div></main>'+tabs()}
function revBlock(w){const l=S.reviews.filter(r=>r.wid===w.id).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
  return '<div class="card panel"><h3>التقييم والملاحظات'+revSum(w.id)+'</h3>'+
  (l.length?l.map(r=>'<button class="entry" data-a="editRev" data-id="'+r.id+'" style="align-items:flex-start"><span class="grow">'+starsHTML(r.stars)+(r.note?'<div style="white-space:normal">'+esc(r.note)+'</div>':'')+'<small>'+fmtD(r.d)+'</small></span></button>').join(''):'<small>لا يوجد تقييم بعد.</small>')+
  '<button class="btn s" data-a="revW">'+ic('plus')+'إضافة تقييم / ملاحظة</button></div>'}
A.addPay=()=>open('pay',{id:null,w:UI.view.id,d:today(),amt:'',note:''});
A.editPay=d=>{const p=S.pays.find(x=>x.id===d.id);if(p)open('pay',{id:p.id,w:p.w,d:p.d,amt:String(p.amt),note:p.note||''})};
A.savePay=()=>{const f=UI.f,a=num(f.amt);if(!(a>0))return toast('اكتب المبلغ');const v={d:f.d||today(),amt:a,note:(f.note||'').trim()};
  if(f.id)Object.assign(S.pays.find(x=>x.id===f.id),v);else S.pays.push(Object.assign({id:uid(),w:f.w},v));save();UI.sh=null;render();toast('تم الحفظ')};
A.delPay=()=>{const id=UI.f.id;ask('حذف هذه الدفعة؟',()=>{S.pays=S.pays.filter(p=>p.id!==id);save();toast('تم الحذف')})};
A.revW=()=>{const w=wk(UI.view.id);open('rev',{id:null,wid:w.id,name:w.name,stars:0,note:''})};
A.noteOpen=d=>{const r=S.reviews.find(x=>x.id===d.id);if(!r)return;if(wk(r.wid)){UI.tab=wk(r.wid).eq?'equip':'workers';UI.view={k:'w',id:r.wid};render()}else A.editRev(d)};
A.editRev=d=>{const r=S.reviews.find(x=>x.id===d.id);if(r)open('rev',{id:r.id,wid:r.wid,name:r.name,stars:r.stars||0,note:r.note||''})};
A.rate=d=>{UI.f.stars=UI.f.stars===+d.v?0:+d.v;sheet()};
A.saveRev=()=>{const f=UI.f,w=wk(f.wid),note=(f.note||'').trim();if(!f.id&&!w)return toast('اختر العامل');if(!f.stars&&!note)return toast('اختر نجوم أو اكتب ملاحظة');
  if(f.id)Object.assign(S.reviews.find(x=>x.id===f.id),{stars:f.stars,note});else S.reviews.push({id:uid(),wid:w.id,name:w.name,stars:f.stars,note,d:today()});
  save();UI.sh=null;render();toast('تم الحفظ')};
A.delRev=()=>{const id=UI.f.id;ask('حذف هذا التقييم؟',()=>{S.reviews=S.reviews.filter(r=>r.id!==id);save();toast('تم الحذف')})};
A.expC=()=>{const w=wk(UI.view.id),nm=w.name.replace(/\s+/g,'-');openMenu('تصدير حساب '+w.name,[
  {t:'كشف حساب PDF',s:'المتفق عليه والمدفوع والباقي',i:'pdf',fn:()=>mkPdf('مقطوعية-'+nm+'.pdf',()=>drawContract(w))},
  {t:'كشف حساب Excel',s:'ملف جاهز للتعديل',i:'sheet',fn:()=>mkX('مقطوعية-'+nm+'.xlsx',()=>xlsxContract(w))}])};
function drawContract(w){const sx=S.settings,L=60,R=1180,ps=payList(w.id).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const agreed=+w.wage||0,paid=r2(ps.reduce((s,p)=>s+p.amt,0)),rem=r2(agreed-paid);
  const cols=[['التاريخ',200],['البيان',720],['المبلغ',200]],cx=[];let xr=R;cols.forEach(k=>{cx.push([xr-k[1],xr]);xr-=k[1]});const mid=i=>(cx[i][0]+cx[i][1])/2;
  const CAP=22,TS=3,RH=52,HH=56,TOP=290,chunks=[];for(let i=0;i<ps.length;i+=CAP)chunks.push(ps.slice(i,i+CAP));if(!chunks.length)chunks.push([]);if(chunks[chunks.length-1].length>CAP-TS)chunks.push([]);
  return chunks.map((chunk,pi)=>{const oo=mk(),x=oo.x,last=pi===chunks.length-1,slots=last?CAP-TS:CAP;
    T(x,sx.company,620,78,{size:30,w:700,max:900,color:'#444'});x.strokeRect(L,116,R-L,70);T(x,'كشف حساب مقطوعية',620,151,{size:34,w:700});
    x.strokeRect(L,188,R-L,80);ln(x,L+470,188,L+470,268);
    T(x,(w.eq?'اسم المعدة: ':'اسم العامل: ')+w.name,R-16,214,{size:28,align:'right',max:R-L-502,w:600});T(x,'الشغل: '+(w.job||''),R-16,248,{size:24,align:'right',max:R-L-502,color:'#444'});
    T(x,'المتفق عليه: '+fmtN(agreed),L+454,228,{size:30,w:700,align:'right',max:430});
    x.fillStyle='#e9ecef';x.fillRect(L,TOP,R-L,HH);x.strokeRect(L,TOP,R-L,HH);cols.forEach((k,i)=>T(x,k[0],mid(i),TOP+HH/2,{size:25,w:700}));
    for(let i=0;i<slots;i++){const y0=TOP+HH+i*RH,m=y0+RH/2,p=chunk[i];x.strokeRect(L,y0,R-L,RH);if(!p)continue;T(x,fmtD(p.d),mid(0),m,{size:23});T(x,p.note||'دفعة',cx[1][1]-12,m,{size:24,align:'right',max:690});T(x,fmtN(p.amt),mid(2),m,{size:25})}
    const yb=TOP+HH+slots*RH;cx.forEach(k=>ln(x,k[0],TOP,k[0],yb));
    if(last)[['المتفق عليه',agreed],['إجمالي المدفوع',paid],[rem<0?'مدفوع زيادة':'الباقي للعامل',Math.abs(rem)]].forEach((r,i)=>{const y0=yb+i*RH,m=y0+RH/2;x.fillStyle=i===2?'#e9ecef':'#f1f3f5';x.fillRect(L,y0,R-L,RH);x.strokeRect(L,y0,R-L,RH);ln(x,cx[2][0],y0,cx[2][0],y0+RH);T(x,r[0],cx[1][1]-12,m,{size:26,w:700,align:'right'});T(x,fmtN(r[1]),mid(2),m,{size:i===2?30:26,w:700,color:i===2&&rem<0?'#b00020':'#111'})});
    ln(x,R-330,1620,R-30,1620);T(x,'توقيع العامل',R-180,1655,{size:28,w:700});ln(x,L+30,1620,L+330,1620);T(x,sx.engineerLabel,L+180,1655,{size:28,w:700,max:290});
    T(x,'صفحة '+(pi+1)+' / '+chunks.length,620,1706,{size:20,color:'#777'});return oo.c})}
function xlsxContract(w){const ps=payList(w.id).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0),agreed=+w.wage||0,paid=r2(ps.reduce((s,p)=>s+p.amt,0));
  const rows=[[{v:'كشف حساب مقطوعية · '+S.settings.company,s:2}],['العامل: '+w.name],['الشغل: '+(w.job||'')],[],HD(['التاريخ','البيان','المبلغ'])];
  ps.forEach(p=>rows.push([fmtD(p.d),p.note||'دفعة',p.amt]));const first=6,last=rows.length;
  rows.push([{v:'إجمالي المدفوع',s:2},null,{f:'SUM(C'+first+':C'+last+')',v:paid,s:2}]);const t=rows.length;
  rows.push([{v:'المتفق عليه',s:2},null,{v:agreed,s:2}]);rows.push([{v:'الباقي',s:2},null,{f:'C'+(t+1)+'-C'+t,v:r2(agreed-paid),s:2}]);
  return buildXlsx([{name:'مقطوعية',rows,widths:[14,34,14]}])}

/* ---------- events ---------- */
const CH={
  photo:t=>{const f=t.files&&t.files[0];if(!f)return;readImage(f).then(u=>{UI.f.photo=u;UI.f.photoNew=true;UI.f.photoRemoved=false;UI.f.hasPhoto=true;sheet()}).catch(()=>toast('تعذّر قراءة الصورة'));t.value=''},
  pd:t=>{if(t.value){UI.date=t.value;render()}},
  off:t=>{S.settings.offDay=+t.value;save()},
  restore:t=>{const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result),d=o&&o.S?o.S:o;if(!d||d.v!==1||!Array.isArray(d.custodies))throw 0;
      ask('استبدال البيانات الحالية بالنسخة الاحتياطية؟',async()=>{S=d;fix();flush();await DB.clear();Object.keys(PH).forEach(k=>delete PH[k]);if(o.photos)for(const k of Object.keys(o.photos))await DB.put(k,o.photos[k]);applyTheme();UI.view=null;render();toast('تمت الاستعادة')},'استبدال')}catch(e){toast('الملف غير صالح')}};r.readAsText(f);t.value=''}};
const app=$('#app');
app.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f)f(t.dataset,t)});
app.addEventListener('input',e=>{const t=e.target;if(t.dataset.q){UI.rq=t.value;const l=$('#rlist');if(l)l.innerHTML=revList();return}if(t.dataset.b)UI.f[t.dataset.b]=t.value;else if(t.dataset.s){S.settings[t.dataset.s]=t.value;save()}});
app.addEventListener('change',e=>{const t=e.target,h=t.dataset&&t.dataset.c;if(h&&CH[h])CH[h](t)});
app.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='f-desc'){e.preventDefault();const a=$('#f-amt');if(a)a.focus()}else if(e.target.id==='f-amt'){e.preventDefault();A.saveE()}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
applyTheme();render();
})();
</script>

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});}
